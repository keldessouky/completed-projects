kind: schema
name: retail.customers.landing
version: 1
description: The customer master export, untyped as delivered.
fields:
  - name: customer_id
    type: string
    description: Stable customer identifier.
    tags: [key]
  - name: full_name
    type: string
    description: Customer's name as given at sign-up.
    tags: ["pii:name"]
  - name: email
    type: string
    description: Contact address.
    tags: ["pii:email"]
  - name: region
    type: string
    description: Sales region the customer belongs to.
  - name: segment
    type: string
    description: Commercial segment - retail, trade or wholesale.
  - name: signed_up_at
    type: string
    description: When the customer account was created, ISO-8601.
