<script>
"use strict";
(() => {
// ===== config.js =====
// Tuning constants — kept numerically identical to GameConfig.swift and
// GameConfig.cs so all three platforms play the same. Units: points and
// seconds; world Y is up (the renderer flips).

const CFG = {
  tile: 16,
  sceneW: 480,
  sceneH: 272,

  gravity: -9.8 * 150,
  maxFallSpeed: 700,

  maxRunSpeed: 116,
  runAcceleration: 640,
  groundFriction: 820,
  airAcceleration: 470,
  jumpSpeed: 452,
  jumpCutSpeed: 145,
  stompBounceSpeed: 310,
  coyoteTime: 0.09,
  jumpBufferTime: 0.12,
  hurtInvulnerabilityTime: 1.6,
  stompVelocityThreshold: -30,

  thugSpeed: 34,

  startLives: 3,
  stageCount: 2,
  stageTimeSeconds: 240,
  coinScore: 100,
  stompScore: 200,
  powerUpScore: 400,
  timeBonusPerSecond: 10,

  cameraLerp: 0.18,
  parallaxFar: 0.15,
  parallaxNear: 0.3,

  fallDeathY: -40,
};

// Every user-facing string, mirrored from the macOS/Windows builds.
const L10N = {
  gameTitle: "اللمبي",
  gameSubtitle: "مغامرات الحارة",
  pressStart: "اضغط المسافة للبدء",
  controlsHint: "الأسهم أو A/D للحركة — المسافة للنط — M للصوت",
  fanDisclaimer: "لعبة معجبين غير رسمية مستوحاة من فيلم «اللمبي» (٢٠٠٢)",

  hudMoney: "الفكة",
  hudLives: "الأرواح",
  hudTime: "الوقت",
  hudPowered: "مفوّل",

  paused: "وقفة يا معلم — اضغط P للمتابعة",
  demo: "عرض تجريبي — اضغط أي زر للعب",

  stageClear: "مبروك يا لمبي!",
  stageClearSub: "وصلت لنوسة بالسلامة",
  gameOver: "خلصت الأرواح يا لمبي",
  gameOverQuote: "«يا عم فوزي… هو في إيه؟»",
  scoreLabel: "النقاط",
  moneyLabel: "الفكة اللي لمّيتها",
  timeBonusLabel: "مكافأة الوقت",
  highScoreLabel: "أعلى نقاط",
  retryHint: "المسافة = من الأول — Enter = شاشة البداية",
  checkpointToast: "نقطة تفتيش — عند عربية الفول!",

  stageName: (n) => (n === 2 ? "المرحلة ٢ — شارع السوق" : "المرحلة ١ — الحارة"),
};

const EASTERN_DIGITS = ["٠", "١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩"];

function eastern(value) {
  return String(value)
    .split("")
    .map((ch) => (ch >= "0" && ch <= "9" ? EASTERN_DIGITS[ch.charCodeAt(0) - 48] : ch))
    .join("");
}

function easternCount(value) {
  return "×" + eastern(value);
}

// ===== parser.js =====
// The ASCII level format — a straight port of LevelParser.swift /
// LevelParser.cs. One character per 16×16 tile, top row first; `//` lines
// are comments; short rows are padded with air.
//
//   .  air          G  ground        D  dirt fill     B  brick
//   X  crate        =  sandstone     ?  crate → coin  F  crate → sandwich
//   o  coin         P  player        E  thug          N  Nousa (goal)
//   C  checkpoint (عربية الفول)

const TILE = {
  GROUND: "G",
  DIRT: "D",
  BRICK: "B",
  CRATE: "X",
  STONE: "=",
  MYSTERY_COIN: "?",
  MYSTERY_SANDWICH: "F",
};

const TILE_CHARS = new Set(Object.values(TILE));

const ENTITY = {
  PLAYER: "P",
  THUG: "E",
  COIN: "o",
  NOUSA: "N",
  CHECKPOINT: "C",
};

const ENTITY_CHARS = new Set(Object.values(ENTITY));

function tileIsMystery(t) {
  return t === TILE.MYSTERY_COIN || t === TILE.MYSTERY_SANDWICH;
}

const TILE_SPRITE = {
  G: "tile_ground",
  D: "tile_dirt",
  B: "tile_brick",
  X: "tile_crate",
  "=": "tile_stone",
  "?": "tile_mystery",
  F: "tile_mystery",
};

class LevelParseError extends Error {
  constructor(kind, detail = "") {
    super(`${kind} ${detail}`.trim());
    this.kind = kind;
  }
}

class LevelData {
  constructor(columns, rows, tiles, entities) {
    this.columns = columns;
    this.rows = rows;
    this.tiles = tiles; // tiles[row][col] → tile char or null, row 0 = top
    this.entities = entities; // [{kind, column, row}]
  }

  tile(column, row) {
    if (row < 0 || row >= this.rows || column < 0 || column >= this.columns) {
      return null;
    }
    return this.tiles[row][column];
  }

  isSolid(column, row) {
    return this.tile(column, row) !== null;
  }

  placements(kind) {
    return this.entities.filter((e) => e.kind === kind);
  }

  get playerSpawn() {
    return this.entities.find((e) => e.kind === ENTITY.PLAYER) ?? null;
  }
}

function parseLevel(text) {
  let lines = text
    .replace(/\r\n/g, "\n")
    .split("\n")
    .filter((l) => !l.startsWith("//"));
  while (lines.length > 0 && lines[0].trim().length === 0) {
    lines.shift();
  }
  while (lines.length > 0 && lines[lines.length - 1].trim().length === 0) {
    lines.pop();
  }
  if (lines.length === 0) {
    throw new LevelParseError("empty");
  }

  const columns = Math.max(...lines.map((l) => l.length));
  if (columns === 0) {
    throw new LevelParseError("empty");
  }

  const tiles = [];
  const entities = [];
  for (let row = 0; row < lines.length; row++) {
    const line = lines[row];
    const out = new Array(columns).fill(null);
    for (let col = 0; col < line.length; col++) {
      const ch = line[col];
      if (ch === "." || ch === " ") {
        continue;
      }
      if (TILE_CHARS.has(ch)) {
        out[col] = ch;
      } else if (ENTITY_CHARS.has(ch)) {
        entities.push({ kind: ch, column: col, row });
      } else {
        throw new LevelParseError("unknownCharacter", `'${ch}' at ${row}:${col}`);
      }
    }
    tiles.push(out);
  }

  const spawns = entities.filter((e) => e.kind === ENTITY.PLAYER).length;
  if (spawns === 0) {
    throw new LevelParseError("missingPlayerSpawn");
  }
  if (spawns > 1) {
    throw new LevelParseError("duplicatePlayerSpawn");
  }
  if (!entities.some((e) => e.kind === ENTITY.NOUSA)) {
    throw new LevelParseError("missingGoal");
  }

  return new LevelData(columns, lines.length, tiles, entities);
}

// ===== world.js =====
// The gameplay simulation — a faithful port of windows/ElLemby.Core/World.cs
// (which mirrors the SpriteKit build's tuning). Deterministic and DOM-free,
// so the node test suite and the in-page attract mode run the same code the
// player does.


const EV = {
  JUMPED: "jumped",
  COIN: "coin",
  CRATE_COIN: "crateCoin",
  CRATE_SANDWICH: "crateSandwich",
  CRATE_SPENT: "crateSpent",
  POWERUP: "powerup",
  STOMPED: "stomped",
  PLAYER_HIT: "playerHit",
  CHECKPOINT: "checkpoint",
  GOAL: "goal",
};

const PLAYER_HALF_W = 6; // 12×22 body
const PLAYER_HALF_H = 11;
const THUG_HALF_W = 6.5;
const THUG_HALF_H = 11;
const COIN_HALF = 5;
const POWER_HALF_W = 7;
const POWER_HALF_H = 5.5;
const POWER_EMERGE_TIME = 0.35;
const POWER_EMERGE_RISE = 14;
const CHECKPOINT_HALF_W = 10;
const CHECKPOINT_HALF_H = 12;
const EPS = 0.01;

function emptyInput() {
  return { moveX: 0, jumpHeld: false, jumpPressedAt: -Infinity };
}

class World {
  constructor(level) {
    this.level = level;
    this.player = {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      facing: 1,
      grounded: false,
      lastGroundedAt: -Infinity,
      invulnerableUntil: -Infinity,
      dead: false,
    };
    this.thugs = [];
    this.coins = [];
    this.powerUps = [];
    this.checkpoints = [];
    this.crates = new Map(); // "col,row" → {column,row,kind,spent,nudgeT}
    this.goalX = 0;
    this.goalY = 0;
    this.goalReached = false;
    this.playerSpawn = { x: 3 * CFG.tile, y: 4 * CFG.tile };
    this.activeRespawn = null;

    const t = CFG.tile;
    for (let row = 0; row < level.rows; row++) {
      for (let col = 0; col < level.columns; col++) {
        const kind = level.tile(col, row);
        if (kind !== null && tileIsMystery(kind)) {
          this.crates.set(`${col},${row}`, {
            column: col,
            row,
            kind,
            spent: false,
            nudgeT: 0,
          });
        }
      }
    }

    for (const p of level.entities) {
      const centerX = p.column * t + t / 2;
      const cellBottom = (level.rows - 1 - p.row) * t;
      switch (p.kind) {
        case ENTITY.PLAYER:
          this.playerSpawn = { x: centerX, y: cellBottom + PLAYER_HALF_H + 1 };
          break;
        case ENTITY.THUG:
          this.thugs.push({
            x: centerX,
            y: cellBottom + THUG_HALF_H + 1,
            vx: 0,
            vy: 0,
            direction: -1,
            squashed: false,
            squashedAt: 0,
            gone: false,
            hasCommandedMove: false,
          });
          break;
        case ENTITY.COIN:
          this.coins.push({ x: centerX, y: cellBottom + t / 2, collected: false });
          break;
        case ENTITY.NOUSA:
          this.goalX = centerX;
          this.goalY = cellBottom + 12;
          break;
        case ENTITY.CHECKPOINT:
          this.checkpoints.push({ x: centerX, y: cellBottom + 12, activated: false });
          break;
      }
    }

    this.player.x = this.playerSpawn.x;
    this.player.y = this.playerSpawn.y;
  }

  get widthPoints() {
    return this.level.columns * CFG.tile;
  }

  // ------------------------------------------------------------------

  step(dt, input, now, ambientOnly = false) {
    const events = [];
    const p = this.player;

    if (p.dead) {
      p.vy = Math.max(p.vy + CFG.gravity * dt, -CFG.maxFallSpeed);
      p.y += p.vy * dt;
      return events;
    }

    this.stepPlayer(dt, input, now, events);

    for (const crate of this.crates.values()) {
      if (crate.nudgeT > 0) {
        crate.nudgeT = Math.max(0, crate.nudgeT - dt);
      }
    }

    if (ambientOnly) {
      return events;
    }

    for (const thug of this.thugs) {
      this.stepThug(thug, dt, now);
    }
    for (const power of this.powerUps) {
      if (!power.collected && power.emergeT < POWER_EMERGE_TIME) {
        power.emergeT += dt;
      }
    }

    this.resolveInteractions(now, events);
    return events;
  }

  stepPlayer(dt, input, now, events) {
    const p = this.player;

    p.grounded = this.probeGround(p.x, p.y, PLAYER_HALF_W - 1, PLAYER_HALF_H);
    if (p.grounded) {
      p.lastGroundedAt = now;
    }

    if (input.moveX !== 0) {
      const accel = p.grounded ? CFG.runAcceleration : CFG.airAcceleration;
      p.vx += input.moveX * accel * dt;
      p.vx = Math.max(-CFG.maxRunSpeed, Math.min(CFG.maxRunSpeed, p.vx));
      p.facing = input.moveX;
    } else if (p.grounded) {
      const drop = CFG.groundFriction * dt;
      p.vx = Math.abs(p.vx) <= drop ? 0 : p.vx - drop * Math.sign(p.vx);
    }

    p.vy = Math.max(p.vy + CFG.gravity * dt, -CFG.maxFallSpeed);

    const buffered = now - input.jumpPressedAt <= CFG.jumpBufferTime;
    const coyote = now - p.lastGroundedAt <= CFG.coyoteTime;
    if (buffered && coyote && p.vy <= 1) {
      p.vy = CFG.jumpSpeed;
      p.lastGroundedAt = -Infinity;
      input.jumpPressedAt = -Infinity;
      p.grounded = false;
      events.push({ kind: EV.JUMPED, x: p.x, y: p.y });
    }

    if (!input.jumpHeld && p.vy > CFG.jumpCutSpeed) {
      p.vy = CFG.jumpCutSpeed;
    }

    const moved = this.moveBody(p, PLAYER_HALF_W, PLAYER_HALF_H, dt, true);
    for (const cell of moved.headHits) {
      this.handleHeadHit(cell, events);
    }
  }

  handleHeadHit(cell, events) {
    const crate = this.crates.get(cell);
    if (!crate) {
      return;
    }
    const t = CFG.tile;
    const cx = crate.column * t + t / 2;
    const cy = (this.level.rows - 1 - crate.row) * t + t / 2;
    crate.nudgeT = 0.12;
    if (crate.spent) {
      events.push({ kind: EV.CRATE_SPENT, x: cx, y: cy });
      return;
    }
    crate.spent = true;
    if (crate.kind === TILE.MYSTERY_COIN) {
      events.push({ kind: EV.CRATE_COIN, x: cx, y: cy });
    } else {
      this.powerUps.push({ x: cx, startY: cy + 2, emergeT: 0, collected: false });
      events.push({ kind: EV.CRATE_SANDWICH, x: cx, y: cy });
    }
  }

  stepThug(thug, dt, now) {
    if (thug.gone) {
      return;
    }
    if (thug.squashed) {
      if (now - thug.squashedAt > 1.1) {
        thug.gone = true;
      }
      return;
    }

    const standing = Math.abs(thug.vy) < 5;
    if (standing) {
      const probeX = thug.x + thug.direction * (THUG_HALF_W + 3);
      const probeY = thug.y - THUG_HALF_H - 4;
      if (!this.isSolidAtPoint(probeX, probeY)) {
        thug.direction = -thug.direction;
      }
    }

    thug.vx = thug.direction * CFG.thugSpeed;
    thug.vy = Math.max(thug.vy + CFG.gravity * dt, -CFG.maxFallSpeed);

    const moved = this.moveBody(thug, THUG_HALF_W, THUG_HALF_H, dt, false);
    if (moved.hitWall && thug.hasCommandedMove) {
      thug.direction = -thug.direction;
    }
    thug.hasCommandedMove = true;
  }

  powerUpY(power) {
    return power.startY + POWER_EMERGE_RISE * Math.min(1, power.emergeT / POWER_EMERGE_TIME);
  }

  resolveInteractions(now, events) {
    const p = this.player;
    const pLeft = p.x - PLAYER_HALF_W;
    const pRight = p.x + PLAYER_HALF_W;
    const pBottom = p.y - PLAYER_HALF_H;
    const pTop = p.y + PLAYER_HALF_H;

    const overlaps = (cx, cy, hw, hh) =>
      pRight > cx - hw && pLeft < cx + hw && pTop > cy - hh && pBottom < cy + hh;

    for (const coin of this.coins) {
      if (!coin.collected && overlaps(coin.x, coin.y, COIN_HALF, COIN_HALF)) {
        coin.collected = true;
        events.push({ kind: EV.COIN, x: coin.x, y: coin.y });
      }
    }

    for (const power of this.powerUps) {
      if (
        !power.collected &&
        power.emergeT >= POWER_EMERGE_TIME &&
        overlaps(power.x, this.powerUpY(power), POWER_HALF_W, POWER_HALF_H)
      ) {
        power.collected = true;
        events.push({ kind: EV.POWERUP, x: power.x, y: this.powerUpY(power) });
      }
    }

    for (const checkpoint of this.checkpoints) {
      if (
        !checkpoint.activated &&
        overlaps(checkpoint.x, checkpoint.y, CHECKPOINT_HALF_W, CHECKPOINT_HALF_H)
      ) {
        checkpoint.activated = true;
        this.activeRespawn = { x: checkpoint.x, y: checkpoint.y };
        events.push({ kind: EV.CHECKPOINT, x: checkpoint.x, y: checkpoint.y });
      }
    }

    for (const thug of this.thugs) {
      if (thug.squashed || thug.gone) {
        continue;
      }
      if (!overlaps(thug.x, thug.y, THUG_HALF_W, THUG_HALF_H)) {
        continue;
      }
      if (p.vy <= CFG.stompVelocityThreshold && pBottom > thug.y) {
        thug.squashed = true;
        thug.squashedAt = now;
        p.vy = CFG.stompBounceSpeed;
        events.push({ kind: EV.STOMPED, x: thug.x, y: thug.y });
      } else if (now >= p.invulnerableUntil) {
        events.push({ kind: EV.PLAYER_HIT, x: thug.x, y: thug.y });
      }
    }

    if (!this.goalReached && overlaps(this.goalX, this.goalY, 8, 12)) {
      this.goalReached = true;
      events.push({ kind: EV.GOAL, x: this.goalX, y: this.goalY });
    }
  }

  // ------------------------------------------------------------------

  killPlayer() {
    this.player.dead = true;
    this.player.vx = 0;
    this.player.vy = 330;
  }

  respawnPlayer(now) {
    const point = this.activeRespawn ?? this.playerSpawn;
    const p = this.player;
    p.dead = false;
    p.x = point.x;
    p.y = point.y;
    p.vx = 0;
    p.vy = 0;
    p.facing = 1;
    p.invulnerableUntil = now + CFG.hurtInvulnerabilityTime;
  }

  // ------------------------------------------------------------------
  // Tile collision (axis-separated AABB, same as the C# sim)
  // ------------------------------------------------------------------

  isSolidCell(column, rowFromBottom) {
    return this.level.isSolid(column, this.level.rows - 1 - rowFromBottom);
  }

  isSolidAtPoint(x, y) {
    if (x < 0 || y < 0) {
      return false;
    }
    return this.isSolidCell(Math.floor(x / CFG.tile), Math.floor(y / CFG.tile));
  }

  probeGround(x, y, halfW, halfH) {
    const below = y - halfH - 1;
    return this.isSolidAtPoint(x - halfW, below) || this.isSolidAtPoint(x + halfW, below);
  }

  moveBody(body, halfW, halfH, dt, collectHeadHits) {
    const t = CFG.tile;
    const result = { hitWall: false, headHits: [] };

    // X axis
    body.x += body.vx * dt;
    if (body.x < halfW) {
      body.x = halfW;
      body.vx = 0;
      result.hitWall = true;
    } else if (body.x > this.widthPoints - halfW) {
      body.x = this.widthPoints - halfW;
      body.vx = 0;
      result.hitWall = true;
    }
    if (body.vx !== 0) {
      const c0 = Math.floor((body.x - halfW) / t);
      const c1 = Math.floor((body.x + halfW - EPS) / t);
      const r0 = Math.floor((body.y - halfH) / t);
      const r1 = Math.floor((body.y + halfH - EPS) / t);
      outer: for (let c = c0; c <= c1; c++) {
        for (let r = r0; r <= r1; r++) {
          if (r < 0 || !this.isSolidCell(c, r)) {
            continue;
          }
          if (body.vx > 0) {
            body.x = c * t - halfW - EPS;
          } else {
            body.x = (c + 1) * t + halfW + EPS;
          }
          body.vx = 0;
          result.hitWall = true;
          break outer;
        }
      }
    }

    // Y axis
    body.y += body.vy * dt;
    if (body.vy !== 0) {
      const c0 = Math.floor((body.x - halfW) / t);
      const c1 = Math.floor((body.x + halfW - EPS) / t);
      const r0 = Math.floor((body.y - halfH) / t);
      const r1 = Math.floor((body.y + halfH - EPS) / t);
      let hit = false;
      if (body.vy < 0) {
        for (let c = c0; c <= c1 && !hit; c++) {
          if (r0 >= 0 && this.isSolidCell(c, r0)) {
            body.y = (r0 + 1) * t + halfH + EPS;
            hit = true;
          }
        }
      } else {
        for (let c = c0; c <= c1; c++) {
          if (r1 >= 0 && this.isSolidCell(c, r1)) {
            if (!hit) {
              body.y = r1 * t - halfH - EPS;
              hit = true;
            }
            if (collectHeadHits) {
              result.headHits.push(`${c},${this.level.rows - 1 - r1}`);
            }
          }
        }
      }
      if (hit) {
        body.vy = 0;
      }
    }

    return result;
  }
}

// ===== bot.js =====
// The runner bot: proves stages completable in the node test suite AND
// plays the arcade attract-mode demo on the title screen. Same policy as
// the C# test bot.


function botDrive(world, input, now) {
  const p = world.player;
  const bottom = p.y - 11;

  const wallAhead =
    world.isSolidAtPoint(p.x + 14, bottom + 2) || world.isSolidAtPoint(p.x + 14, p.y + 8);
  const nearGround = p.grounded || now - p.lastGroundedAt <= CFG.coyoteTime;
  const gapBelow = (x) => !world.isSolidAtPoint(x, CFG.tile);
  const deadlyAhead = gapBelow(p.x + 8) || gapBelow(p.x + 24) || gapBelow(p.x + 40);
  // Press only at the true edge: air at the feet AND the very next ground
  // column void — otherwise descending from a stall with a pit on the
  // horizon wastes the coyote jump mid-fall.
  const edgeAtFeet =
    nearGround && !world.isSolidAtPoint(p.x + 8, bottom - 6) && gapBelow(p.x + 8);

  input.moveX = 1;
  if (wallAhead || edgeAtFeet) {
    input.jumpPressedAt = now;
  }
  input.jumpHeld = wallAhead || deadlyAhead;
}

// Chiptune synth — a JS port of tools/generate_sfx.py. Instead of shipping
// WAVs, the web build renders every effect and the maqam-hijaz music loop
// into buffers at load time from the same note data. Pure math (node-
// testable); the browser wrapper at the bottom feeds WebAudio.

const SAMPLE_RATE = 22050;

function square(phase) {
  return phase % 1 < 0.5 ? 1 : -1;
}

function triangle(phase) {
  const p = phase % 1;
  return p < 0.5 ? 4 * p - 1 : 3 - 4 * p;
}

// Deterministic noise (xorshift) so renders are reproducible.
function makeNoise(seed) {
  let s = seed >>> 0 || 2002;
  return () => {
    s ^= s << 13;
    s ^= s >>> 17;
    s ^= s << 5;
    s >>>= 0;
    return (s / 0xffffffff) * 2 - 1;
  };
}

// events: [start, dur, freqFn|null (null = noise), osc, vol, decayPow]
function renderEvents(events, length) {
  const n = Math.floor(length * SAMPLE_RATE);
  const buf = new Float32Array(n);
  const noise = makeNoise(2002);
  for (const [start, dur, freqFn, osc, vol, decay] of events) {
    const i0 = Math.floor(start * SAMPLE_RATE);
    const ns = Math.floor(dur * SAMPLE_RATE);
    let phase = 0;
    for (let i = 0; i < ns; i++) {
      const t01 = i / Math.max(1, ns - 1);
      const env = Math.pow(1 - t01, decay);
      let s;
      if (freqFn === null) {
        s = noise();
      } else {
        phase += freqFn(t01) / SAMPLE_RATE;
        s = osc(phase);
      }
      const j = i0 + i;
      if (j >= 0 && j < n) {
        buf[j] += s * vol * env;
      }
    }
  }
  for (let i = 0; i < n; i++) {
    buf[i] = Math.max(-1, Math.min(1, buf[i]));
  }
  return buf;
}

const konst = (f) => () => f;
const sweep = (f0, f1) => (t) => f0 + (f1 - f0) * t;

// --- music: maqam hijaz on E, 110 BPM, 8 bars ------------------------------

const NOTE_HZ = {
  E2: 82.41, F2: 87.31, B2: 123.47, C3: 130.81, D3: 146.83,
  E3: 164.81, F3: 174.61, "G#3": 207.65, A3: 220.0, B3: 246.94,
  E4: 329.63, F4: 349.23, "G#4": 415.3, A4: 440.0, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.26,
};

const MELODY = [
  "E5 D5 C5 B4 C5 B4 A4 G#4",
  "A4 B4 C5 B4 A4 G#4 F4 E4",
  "E4 F4 G#4 A4 B4 C5 D5 E5",
  "D5 C5 B4 A4 G#4 A4 F4 E4",
  "E5 - . E5 D5 C5 B4 C5",
  "D5 - C5 B4 A4 G#4 A4 B4",
  "C5 B4 A4 G#4 F4 G#4 A4 B4",
  "E4 - E4 F4 G#4 A4 B4 E5",
];

const BASS = [
  "E2 E3 E2 E3",
  "F2 F3 E2 B2",
  "E2 E3 A3 E3",
  "F2 F3 B2 E2",
  "E2 E3 E2 E3",
  "F2 F3 E2 B2",
  "A3 E3 F3 E3",
  "F2 B2 E2 E2",
];

function musicEvents() {
  const bpm = 110;
  const eighth = 60 / bpm / 2;
  const length = 8 * 8 * eighth;
  const ev = [];
  MELODY.forEach((line, bar) => {
    const toks = line.split(/\s+/);
    let i = 0;
    while (i < toks.length) {
      const tok = toks[i];
      if (tok === "." || tok === "-") {
        i += 1;
        continue;
      }
      let dur = 1;
      let j = i + 1;
      while (j < toks.length && toks[j] === "-") {
        dur += 1;
        j += 1;
      }
      ev.push([(bar * 8 + i) * eighth, dur * eighth * 0.92, konst(NOTE_HZ[tok]), square, 0.16, 0.35]);
      i = j;
    }
  });
  BASS.forEach((line, bar) => {
    line.split(/\s+/).forEach((tok, q) => {
      ev.push([(bar * 8 + q * 2) * eighth, eighth * 2 * 0.9, konst(NOTE_HZ[tok]), triangle, 0.22, 0.25]);
    });
  });
  for (let e = 0; e < 64; e++) {
    if (e % 2 === 1) {
      ev.push([e * eighth, 0.03, null, null, 0.07, 2.0]);
    }
  }
  return { events: ev, length };
}

// --- browser wrapper --------------------------------------------------------

class GameAudio {
  constructor() {
    this.ctx = null;
    this.buffers = {};
    this.musicSource = null;
    this.musicBuffer = null;
    this.muted = false;
  }

  /** Must be called from a user gesture. Idempotent. */
  ensure() {
    if (this.ctx || typeof AudioContext === "undefined") {
      return;
    }
    this.ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
    for (const [name, def] of Object.entries(SFX_DEFS)) {
      this.buffers[name] = this.toBuffer(renderEvents(def.events, def.length));
    }
    const music = musicEvents();
    this.musicBuffer = this.toBuffer(renderEvents(music.events, music.length));
  }

  toBuffer(samples) {
    const buffer = this.ctx.createBuffer(1, samples.length, SAMPLE_RATE);
    buffer.copyToChannel(samples, 0);
    return buffer;
  }

  play(name) {
    if (!this.ctx || this.muted || !this.buffers[name]) {
      return;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = this.buffers[name];
    src.connect(this.ctx.destination);
    src.start();
  }

  startMusic() {
    if (!this.ctx || this.muted || this.musicSource || !this.musicBuffer) {
      return;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = this.musicBuffer;
    src.loop = true;
    const gain = this.ctx.createGain();
    gain.gain.value = 0.5;
    src.connect(gain).connect(this.ctx.destination);
    src.start();
    this.musicSource = src;
  }

  stopMusic() {
    if (this.musicSource) {
      try {
        this.musicSource.stop();
      } catch {
        // already stopped
      }
      this.musicSource = null;
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) {
      this.stopMusic();
    } else {
      this.startMusic();
    }
  }
}

// ===== render.js =====
// Sprite decoding and canvas draw helpers. Sprites arrive as base64 PNGs
// (generated into assets.js by tools/build_web.py from the shared pixel
// art); they're decoded once into offscreen canvases plus flipped variants.


const PALETTE = {
  sky: "#a6ccd8",
  ink: "#140f12",
  gold: "#c78d1d",
  cream: "#f3ece0",
  maroon: "#992f3e",
  night: "#1e1a24",
};

const FONT_STACK =
  '"Segoe UI", "Geeza Pro", "Noto Naskh Arabic", "Noto Sans Arabic", "Arial", sans-serif';

const SPRITES = {};
const FLIPPED = {};

function loadSprites() {
  const jobs = Object.entries(SPRITE_DATA).map(
    ([name, b64]) =>
      new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = img.width;
          c.height = img.height;
          c.getContext("2d").drawImage(img, 0, 0);
          SPRITES[name] = c;
          resolve();
        };
        img.onerror = () => reject(new Error(`sprite ${name} failed to decode`));
        img.src = "data:image/png;base64," + b64;
      }),
  );
  return Promise.all(jobs);
}

function flipped(name) {
  if (!FLIPPED[name]) {
    const src = SPRITES[name];
    const c = document.createElement("canvas");
    c.width = src.width;
    c.height = src.height;
    const ctx = c.getContext("2d");
    ctx.translate(src.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(src, 0, 0);
    FLIPPED[name] = c;
  }
  return FLIPPED[name];
}

function drawText(ctx, text, { x, y, size, align = "center", color, bold = false, alpha = 1 }) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = `${bold ? "bold " : ""}${size}px ${FONT_STACK}`;
  ctx.direction = "rtl";
  ctx.textAlign = align === "center" ? "center" : align === "right" ? "right" : "left";
  ctx.textBaseline = "top";
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ===== scenes.js =====
// Scenes: title (with arcade attract mode), gameplay, and results — the
// canvas port of the WinForms scene layer, driven by the shared JS sim.


const W = CFG.sceneW;
const H = CFG.sceneH;

class GameState {
  constructor() {
    this.money = 0;
    this.score = 0;
    this.lives = CFG.startLives;
    this.isPowered = false;
  }

  get highScore() {
    try {
      return Number(globalThis.localStorage?.getItem("ellemby.highscore") ?? 0) || 0;
    } catch {
      return 0;
    }
  }

  collectCoin() {
    this.money += 1;
    this.score += CFG.coinScore;
  }

  awardTimeBonus(secondsLeft) {
    const bonus = Math.max(0, secondsLeft) * CFG.timeBonusPerSecond;
    this.score += bonus;
    return bonus;
  }

  commitHighScore() {
    try {
      if (this.score > this.highScore) {
        globalThis.localStorage?.setItem("ellemby.highscore", String(this.score));
      }
    } catch {
      // storage unavailable (private mode etc.) — high score just won't stick
    }
  }
}

function spriteAt(ctx, name, cx, sy, w, h) {
  ctx.drawImage(SPRITES[name], Math.round(cx - w / 2), Math.round(sy), w, h);
}

// ---------------------------------------------------------------------------

class TitleScene {
  constructor(host) {
    this.host = host;
    this.idleSince = null;
  }

  update(dt, now) {
    if (this.idleSince === null) {
      this.idleSince = now;
    }
    if (now - this.idleSince > 7) {
      this.host.switch(new GameScene(this.host, 1, { demo: true }));
    }
  }

  keyPressed(code, now) {
    this.idleSince = now;
    if (code === "Space" || code === "Enter") {
      this.host.state = new GameState();
      this.host.switch(new GameScene(this.host, 1));
    } else if (code === "KeyM") {
      this.host.audio.toggleMute();
    }
  }

  keyReleased() {}

  draw(ctx, now) {
    ctx.fillStyle = PALETTE.sky;
    ctx.fillRect(0, 0, W, H);

    const near = SPRITES.bg_near;
    ctx.drawImage(near, 0, H - 32 - near.height);
    for (let col = 0; col <= W / 16; col++) {
      ctx.drawImage(SPRITES.tile_ground, col * 16, H - 32);
      ctx.drawImage(SPRITES.tile_dirt, col * 16, H - 16);
    }

    const lemby = Math.floor(now / 0.45) % 2 === 0 ? "lemby_idle_0" : "lemby_idle_1";
    const nousa = Math.floor(now / 0.5) % 2 === 0 ? "nousa_0" : "nousa_1";
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(SPRITES[lemby], W / 2 - 90 - 24, H - 32 - 72, 48, 72);
    ctx.drawImage(SPRITES[nousa], W / 2 + 90 - 24, H - 32 - 72, 48, 72);

    drawText(ctx, L10N.gameTitle, { x: W / 2, y: 22, size: 44, color: PALETTE.maroon, bold: true });
    drawText(ctx, L10N.gameSubtitle, { x: W / 2, y: 80, size: 16, color: PALETTE.ink, bold: true });
    if (Math.floor(now / 0.55) % 2 === 0) {
      drawText(ctx, L10N.pressStart, { x: W / 2, y: 116, size: 13, color: PALETTE.ink, bold: true });
    }
    drawText(ctx, L10N.controlsHint, { x: W / 2, y: 140, size: 9, color: PALETTE.ink });
    if (this.host.state.highScore > 0) {
      drawText(ctx, `${L10N.highScoreLabel}: ${eastern(this.host.state.highScore)}`, {
        x: W / 2, y: 156, size: 9, color: PALETTE.ink,
      });
    }
    drawText(ctx, L10N.fanDisclaimer, {
      x: W / 2, y: H - 15, size: 8.5, color: PALETTE.cream, alpha: 0.9,
    });
  }
}

const PHASE = { PLAYING: 0, PAUSED: 1, DYING: 2, WON: 3 };

class GameScene {
  constructor(host, stage, { demo = false } = {}) {
    this.host = host;
    this.stage = stage;
    this.demo = demo;
    this.state = demo ? new GameState() : host.state;
    this.world = new World(parseLevel(LEVELS[`level${stage}`]));
    this.input = emptyInput();
    this.phase = PHASE.PLAYING;
    this.phaseAt = 0;
    this.camX = this.clampCam(this.world.playerSpawn.x);
    this.timeLeft = CFG.stageTimeSeconds;
    this.clockAcc = 0;
    this.bornAt = null;
    this.pendingBonus = 0;
    this.toastAt = -Infinity;
    this.toastText = "";
    this.particles = [];
    if (!demo) {
      host.audio.startMusic();
    }
  }

  clampCam(x) {
    const half = W / 2;
    return Math.min(Math.max(x, half), Math.max(half, this.world.widthPoints - half));
  }

  keyPressed(code, now) {
    if (this.demo) {
      // Any button leaves the demo and starts a real game.
      this.host.state = new GameState();
      this.host.switch(code === "Space" || code === "Enter"
        ? new GameScene(this.host, 1)
        : new TitleScene(this.host));
      return;
    }
    if (code === "Space" || code === "ArrowUp" || code === "KeyW") {
      this.input.jumpPressedAt = now;
    } else if (code === "KeyP" || code === "Escape") {
      this.togglePause();
    } else if (code === "KeyM") {
      this.host.audio.toggleMute();
    }
  }

  keyReleased() {}

  togglePause() {
    if (this.phase === PHASE.PLAYING) {
      this.phase = PHASE.PAUSED;
      this.host.audio.stopMusic();
    } else if (this.phase === PHASE.PAUSED) {
      this.phase = PHASE.PLAYING;
      this.host.audio.startMusic();
    }
  }

  update(dt, now) {
    if (this.bornAt === null) {
      this.bornAt = now;
      this.phaseAt = now;
    }
    this.particles = this.particles.filter((p) => now - p.bornAt - p.delay <= p.life);

    switch (this.phase) {
      case PHASE.PAUSED:
        return;

      case PHASE.PLAYING: {
        if (this.demo) {
          botDrive(this.world, this.input, now);
        } else {
          const inp = this.host.inputState;
          this.input.moveX =
            (inp.has("ArrowLeft") || inp.has("KeyA") ? -1 : 0) +
            (inp.has("ArrowRight") || inp.has("KeyD") ? 1 : 0);
          this.input.jumpHeld = inp.has("Space") || inp.has("ArrowUp") || inp.has("KeyW");
        }
        const events = this.world.step(dt, this.input, now);
        this.handleEvents(events, now);
        this.tickClock(dt, now);
        if (this.phase === PHASE.PLAYING && this.world.player.y < CFG.fallDeathY) {
          this.startDeath(now);
        }
        this.moveCamera();
        break;
      }

      case PHASE.DYING: {
        this.world.step(dt, emptyInput(), now);
        if (now - this.phaseAt > 1.5) {
          this.afterDeath(now);
        }
        break;
      }

      case PHASE.WON: {
        this.world.step(dt, emptyInput(), now, true);
        this.moveCamera();
        if (now - this.phaseAt > 2.0) {
          if (this.demo) {
            this.host.switch(new TitleScene(this.host));
          } else if (this.stage < CFG.stageCount) {
            this.host.switch(new GameScene(this.host, this.stage + 1));
          } else {
            this.host.switch(new ResultScene(this.host, "clear", this.pendingBonus));
          }
        }
        break;
      }
    }
  }

  moveCamera() {
    const target = this.clampCam(this.world.player.x);
    this.camX += (target - this.camX) * CFG.cameraLerp;
  }

  tickClock(dt, now) {
    this.clockAcc += dt;
    while (this.clockAcc >= 1) {
      this.clockAcc -= 1;
      this.timeLeft -= 1;
      if (this.timeLeft <= 0) {
        this.timeLeft = 0;
        this.startDeath(now);
        return;
      }
    }
  }

  handleEvents(events, now) {
    const audio = this.host.audio;
    for (const e of events) {
      switch (e.kind) {
        case EV.JUMPED:
          audio.play("jump");
          break;
        case EV.COIN:
          this.state.collectCoin();
          audio.play("coin");
          break;
        case EV.CRATE_COIN:
          this.state.collectCoin();
          audio.play("coin");
          this.particles.push({
            frames: ["coin_0", "coin_1", "coin_2", "coin_3"],
            x: e.x, y: e.y + 14, vy: 110,
            bornAt: now, delay: 0, life: 0.34, frameTime: 0.06,
          });
          break;
        case EV.CRATE_SANDWICH:
        case EV.CRATE_SPENT:
          audio.play("bump");
          break;
        case EV.POWERUP:
          this.state.isPowered = true;
          this.state.score += CFG.powerUpScore;
          audio.play("powerup");
          break;
        case EV.STOMPED:
          this.state.score += CFG.stompScore;
          audio.play("stomp");
          break;
        case EV.PLAYER_HIT:
          this.onPlayerHit(now);
          break;
        case EV.CHECKPOINT:
          audio.play("checkpoint");
          this.toastAt = now;
          this.toastText = L10N.checkpointToast;
          break;
        case EV.GOAL:
          this.winStage(now);
          break;
      }
      if (this.phase !== PHASE.PLAYING) {
        break;
      }
    }
  }

  onPlayerHit(now) {
    const p = this.world.player;
    if (p.dead || now < p.invulnerableUntil) {
      return;
    }
    if (this.state.isPowered) {
      this.state.isPowered = false;
      this.host.audio.play("hurt");
      p.invulnerableUntil = now + CFG.hurtInvulnerabilityTime;
    } else {
      this.startDeath(now);
    }
  }

  startDeath(now) {
    if (this.phase !== PHASE.PLAYING) {
      return;
    }
    this.phase = PHASE.DYING;
    this.phaseAt = now;
    this.state.lives -= 1;
    this.state.isPowered = false;
    this.world.killPlayer();
    if (this.state.lives <= 0) {
      this.host.audio.stopMusic();
      this.host.audio.play("gameover");
    } else {
      this.host.audio.play("hurt");
    }
  }

  afterDeath(now) {
    if (this.demo) {
      this.host.switch(new TitleScene(this.host));
      return;
    }
    if (this.state.lives > 0) {
      this.timeLeft = CFG.stageTimeSeconds;
      this.clockAcc = 0;
      this.world.respawnPlayer(now);
      this.camX = this.clampCam(this.world.player.x);
      this.phase = PHASE.PLAYING;
      this.phaseAt = now;
    } else {
      this.state.commitHighScore();
      this.host.switch(new ResultScene(this.host, "gameover", 0));
    }
  }

  winStage(now) {
    if (this.phase !== PHASE.PLAYING) {
      return;
    }
    this.phase = PHASE.WON;
    this.phaseAt = now;
    this.input = emptyInput();
    this.world.player.vx = 0;
    this.host.audio.stopMusic();
    this.host.audio.play("win");
    this.pendingBonus = this.state.awardTimeBonus(this.timeLeft);
    if (!this.demo) {
      this.state.commitHighScore();
    }
    for (let i = 0; i < 6; i++) {
      this.particles.push({
        frames: ["heart"],
        x: this.world.goalX + ((i % 3) - 1) * 12 + i * 2,
        y: this.world.goalY + 10,
        vy: 29,
        bornAt: now, delay: 0.15 * i, life: 1.15, frameTime: 1,
      });
    }
  }

  // ------------------------------------------------------------------

  get camLeft() {
    return this.camX - W / 2;
  }

  worldRect(wx, wy, w, h) {
    return [Math.round(wx - this.camLeft - w / 2), Math.round(H - (wy + h / 2)), w, h];
  }

  draw(ctx, now) {
    ctx.fillStyle = PALETTE.sky;
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;

    this.drawParallax(ctx, SPRITES.bg_far, CFG.parallaxFar, 44);
    this.drawParallax(ctx, SPRITES.bg_near, CFG.parallaxNear, 32);
    this.drawTiles(ctx);
    this.drawEntities(ctx, now);
    this.drawParticles(ctx, now);
    this.drawHud(ctx);
    this.drawOverlays(ctx, now);
  }

  drawParallax(ctx, strip, parallax, bottomWorldY) {
    const y = H - bottomWorldY - strip.height;
    const w = strip.width;
    const phase = ((((-this.camLeft * parallax) % w) + w) % w) - w;
    for (let x = phase; x < W; x += w) {
      ctx.drawImage(strip, Math.round(x), y);
    }
  }

  drawTiles(ctx) {
    const level = this.world.level;
    const t = CFG.tile;
    const first = Math.max(0, Math.floor(this.camLeft / t) - 1);
    const last = Math.min(level.columns - 1, first + W / t + 2);
    for (let col = first; col <= last; col++) {
      const sx = Math.round(col * t - this.camLeft);
      for (let row = 0; row < level.rows; row++) {
        const kind = level.tile(col, row);
        if (kind === null) {
          continue;
        }
        let sy = H - (level.rows - row) * t;
        let sprite = {
          G: "tile_ground", D: "tile_dirt", B: "tile_brick", X: "tile_crate",
          "=": "tile_stone", "?": "tile_mystery", F: "tile_mystery",
        }[kind];
        const crate = this.world.crates.get(`${col},${row}`);
        if (crate) {
          if (crate.spent) {
            sprite = "tile_crate_used";
          }
          if (crate.nudgeT > 0) {
            sy -= Math.round(3 * (crate.nudgeT / 0.12));
          }
        }
        ctx.drawImage(SPRITES[sprite], sx, sy);
      }
    }
  }

  drawEntities(ctx, now) {
    const w = this.world;
    const coinFrame = Math.floor(now / 0.12) % 4;
    for (const coin of w.coins) {
      if (!coin.collected) {
        ctx.drawImage(SPRITES[`coin_${coinFrame}`], ...this.worldRect(coin.x, coin.y, 12, 12));
      }
    }
    for (const power of w.powerUps) {
      if (!power.collected) {
        ctx.drawImage(SPRITES.sandwich, ...this.worldRect(power.x, w.powerUpY(power), 14, 11));
      }
    }
    const nousa = Math.floor(now / 0.5) % 2 === 0 ? "nousa_0" : "nousa_1";
    ctx.drawImage(SPRITES[nousa], ...this.worldRect(w.goalX, w.goalY, 16, 24));

    for (const cp of w.checkpoints) {
      const cart = cp.activated ? "checkpoint_active" : "checkpoint_idle";
      ctx.drawImage(SPRITES[cart], ...this.worldRect(cp.x, cp.y, 16, 24));
    }

    for (const thug of w.thugs) {
      if (thug.gone) {
        continue;
      }
      if (thug.squashed) {
        const age = now - thug.squashedAt;
        ctx.globalAlpha = age < 0.8 ? 1 : Math.max(0, 1 - (age - 0.8) / 0.3);
        ctx.drawImage(SPRITES.thug_squashed, ...this.worldRect(thug.x, thug.y - 11 + 5, 16, 10));
        ctx.globalAlpha = 1;
      } else {
        const frame = Math.floor(now / 0.22) % 2 === 0 ? "thug_walk_0" : "thug_walk_1";
        const img = thug.direction > 0 ? flipped(frame) : SPRITES[frame];
        ctx.drawImage(img, ...this.worldRect(thug.x, thug.y, 16, 24));
      }
    }

    this.drawPlayer(ctx, now);
  }

  drawPlayer(ctx, now) {
    const p = this.world.player;
    if (!p.dead && now < p.invulnerableUntil && Math.floor(now * 10) % 2 === 1) {
      return;
    }
    let frame;
    if (p.dead) {
      frame = "lemby_hurt_0";
    } else if (!p.grounded) {
      frame = "lemby_jump_0";
    } else if (Math.abs(p.vx) > 8) {
      frame = `lemby_run_${[0, 1, 2, 1][Math.floor(now / 0.09) % 4]}`;
    } else {
      frame = Math.floor(now / 0.45) % 2 === 0 ? "lemby_idle_0" : "lemby_idle_1";
    }
    const img = p.facing < 0 ? flipped(frame) : SPRITES[frame];
    ctx.drawImage(img, ...this.worldRect(p.x, p.y, 16, 24));
  }

  drawParticles(ctx, now) {
    for (const part of this.particles) {
      const age = now - part.bornAt - part.delay;
      if (age < 0) {
        continue;
      }
      const y = part.y + part.vy * age;
      const frame = part.frames[Math.floor(age / part.frameTime) % part.frames.length];
      const img = SPRITES[frame];
      ctx.globalAlpha = Math.max(0, Math.min(1, 1.6 - (age / part.life) * 1.6));
      ctx.drawImage(img, ...this.worldRect(part.x, y, img.width, img.height));
      ctx.globalAlpha = 1;
    }
  }

  drawHud(ctx) {
    drawText(ctx, `${L10N.hudMoney} ${easternCount(this.state.money)}`, {
      x: W - 10, y: 5, size: 11, align: "right", color: PALETTE.ink, bold: true,
    });
    drawText(ctx, `${L10N.hudLives} ${easternCount(this.state.lives)}`, {
      x: W / 2, y: 5, size: 11, color: PALETTE.ink, bold: true,
    });
    drawText(ctx, `${L10N.hudTime} ${eastern(this.timeLeft)}`, {
      x: 10, y: 5, size: 11, align: "left", color: PALETTE.ink, bold: true,
    });
    if (this.state.isPowered) {
      drawText(ctx, L10N.hudPowered, {
        x: W - 10, y: 21, size: 11, align: "right", color: PALETTE.gold, bold: true,
      });
    }
  }

  drawOverlays(ctx, now) {
    if (this.bornAt !== null) {
      const age = now - this.bornAt;
      if (age < 2.3) {
        drawText(ctx, L10N.stageName(this.stage), {
          x: W / 2, y: 84, size: 15, color: PALETTE.ink, bold: true,
          alpha: Math.max(0, Math.min(1, (2.3 - age) / 0.5)),
        });
      }
    }
    const toastAge = now - this.toastAt;
    if (toastAge >= 0 && toastAge < 1.6) {
      drawText(ctx, this.toastText, {
        x: W / 2, y: 44, size: 11, color: PALETTE.gold, bold: true,
        alpha: Math.max(0, Math.min(1, (1.6 - toastAge) / 0.4)),
      });
    }
    if (this.demo && Math.floor(now / 0.6) % 2 === 0) {
      drawText(ctx, L10N.demo, {
        x: W / 2, y: H - 24, size: 12, color: PALETTE.cream, bold: true,
      });
    }
    if (this.phase === PHASE.PAUSED) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);
      drawText(ctx, L10N.paused, { x: W / 2, y: 118, size: 15, color: PALETTE.cream, bold: true });
    }
  }
}

// ---------------------------------------------------------------------------

class ResultScene {
  constructor(host, kind, timeBonus) {
    this.host = host;
    this.kind = kind;
    this.timeBonus = timeBonus;
  }

  update() {}

  keyPressed(code) {
    if (code === "Space") {
      this.host.state = new GameState();
      this.host.switch(new GameScene(this.host, 1));
    } else if (code === "Enter" || code === "Escape") {
      this.host.switch(new TitleScene(this.host));
    } else if (code === "KeyM") {
      this.host.audio.toggleMute();
    }
  }

  keyReleased() {}

  draw(ctx, now) {
    ctx.fillStyle = PALETTE.night;
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;
    const state = this.host.state;

    const stats = [];
    if (this.kind === "clear") {
      drawText(ctx, L10N.stageClear, { x: W / 2, y: 36, size: 26, color: PALETTE.gold, bold: true });
      drawText(ctx, L10N.stageClearSub, { x: W / 2, y: 74, size: 12, color: PALETTE.cream });
      stats.push(`${L10N.timeBonusLabel}: ${eastern(this.timeBonus)}`);
      ctx.drawImage(SPRITES.lemby_idle_0, W / 2 - 60, 106, 40, 60);
      ctx.drawImage(SPRITES.nousa_0, W / 2 + 20, 106, 40, 60);
      const beat = Math.round(6 + 4 * Math.abs(Math.sin(now * 3.5)));
      ctx.drawImage(SPRITES.heart, W / 2 - beat, 96 - beat, beat * 2, beat * 2);
    } else {
      drawText(ctx, L10N.gameOver, { x: W / 2, y: 36, size: 26, color: PALETTE.maroon, bold: true });
      drawText(ctx, L10N.gameOverQuote, { x: W / 2, y: 74, size: 12, color: PALETTE.cream });
      ctx.drawImage(SPRITES.lemby_hurt_0, W / 2 - 20, 106, 40, 60);
    }
    stats.push(`${L10N.moneyLabel}: ${eastern(state.money)}`);
    stats.push(`${L10N.scoreLabel}: ${eastern(state.score)}`);
    stats.push(`${L10N.highScoreLabel}: ${eastern(state.highScore)}`);
    stats.forEach((line, i) => {
      drawText(ctx, line, { x: W / 2, y: 180 + i * 17, size: 11, color: PALETTE.cream });
    });
    if (Math.floor(now / 0.6) % 2 === 0) {
      drawText(ctx, L10N.retryHint, { x: W / 2, y: 248, size: 10, color: PALETTE.cream, alpha: 0.85 });
    }
  }
}

// ===== input.js =====
// Keyboard (physical key codes — identical on Arabic layouts) plus
// on-screen touch controls for phones and tablets.

const GAME_CODES = new Set([
  "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space",
  "KeyA", "KeyD", "KeyW", "KeyP", "KeyM", "Escape", "Enter",
]);

function setupInput(host, onFirstGesture) {
  const pressed = new Set();
  host.inputState = pressed;
  let gestured = false;

  const gesture = () => {
    if (!gestured) {
      gestured = true;
      onFirstGesture();
    }
  };

  window.addEventListener("keydown", (e) => {
    if (!GAME_CODES.has(e.code)) {
      return;
    }
    e.preventDefault();
    gesture();
    if (pressed.has(e.code)) {
      return; // auto-repeat
    }
    pressed.add(e.code);
    host.scene.keyPressed(e.code, host.now);
  });

  window.addEventListener("keyup", (e) => {
    if (!GAME_CODES.has(e.code)) {
      return;
    }
    pressed.delete(e.code);
    host.scene.keyReleased(e.code, host.now);
  });

  // --- touch buttons ------------------------------------------------------

  const coarse =
    typeof matchMedia !== "undefined" && matchMedia("(pointer: coarse)").matches;
  if (!coarse && !("ontouchstart" in window)) {
    return;
  }

  const pad = document.createElement("div");
  pad.id = "touchpad";
  const mkButton = (label, code, side) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = `tbtn ${side}`;
    b.setAttribute("aria-label", code);
    const down = (e) => {
      e.preventDefault();
      gesture();
      if (!pressed.has(code)) {
        pressed.add(code);
        host.scene.keyPressed(code, host.now);
      }
    };
    const up = (e) => {
      e.preventDefault();
      pressed.delete(code);
      host.scene.keyReleased(code, host.now);
    };
    b.addEventListener("pointerdown", down);
    b.addEventListener("pointerup", up);
    b.addEventListener("pointercancel", up);
    b.addEventListener("pointerleave", up);
    b.addEventListener("contextmenu", (e) => e.preventDefault());
    pad.appendChild(b);
    return b;
  };

  mkButton("→", "ArrowRight", "right2");
  mkButton("←", "ArrowLeft", "right1");
  mkButton("نط", "Space", "left1");
  document.body.appendChild(pad);
}

// ===== main.js =====
// Boot: decode sprites, build the canvas, run the fixed-step loop, and
// route scenes. `?demo=1` jumps straight into the attract-mode bot demo
// (also used for headless screenshot verification in CI/dev).


const STEP = 1 / 60;

async function boot() {
  await loadSprites();

  const stageEl = document.getElementById("ellemby") ?? document.body;
  const canvas = document.createElement("canvas");
  canvas.width = CFG.sceneW;
  canvas.height = CFG.sceneH;
  canvas.id = "game";
  stageEl.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const host = {
    audio: new GameAudio(),
    state: new GameState(),
    scene: null,
    now: 0,
    switch(scene) {
      host.scene = scene;
    },
    inputState: new Set(),
  };

  const params = new URLSearchParams(location.search);
  host.scene = params.get("demo")
    ? new GameScene(host, Number(params.get("stage") || 1), { demo: true })
    : new TitleScene(host);

  setupInput(host, () => {
    host.audio.ensure();
    host.audio.startMusic();
  });

  // Fit the canvas to the window, preferring crisp integer scales.
  const fit = () => {
    const availW = stageEl.clientWidth || window.innerWidth;
    const availH = window.innerHeight;
    let scale = Math.min(availW / CFG.sceneW, availH / CFG.sceneH);
    if (scale >= 1) {
      scale = Math.max(1, Math.floor(scale * 2) / 2); // whole and half steps
    }
    canvas.style.width = `${Math.floor(CFG.sceneW * scale)}px`;
    canvas.style.height = `${Math.floor(CFG.sceneH * scale)}px`;
  };
  window.addEventListener("resize", fit);
  fit();

  let last = performance.now() / 1000;
  let acc = 0;
  const frame = () => {
    const t = performance.now() / 1000;
    acc += Math.min(t - last, 0.1);
    last = t;
    while (acc >= STEP) {
      acc -= STEP;
      host.now += STEP;
      host.scene.update(STEP, host.now);
    }
    host.scene.draw(ctx, host.now);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

boot().catch((err) => {
  const msg = document.createElement("pre");
  msg.textContent = "تعذّر تشغيل اللعبة:\n" + (err?.stack ?? String(err));
  msg.style.color = "#f3ece0";
  document.body.appendChild(msg);
});

})();
