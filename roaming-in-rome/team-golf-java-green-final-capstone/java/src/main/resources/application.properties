# datasource connection properties
spring.datasource.url=jdbc:postgresql://localhost:5432/final_capstone
spring.datasource.name=final_capstone
spring.datasource.username=postgres
spring.datasource.password=

jwt.header=Authorization

# The signing key comes from the environment, not from this file.
#
# It used to be a literal base64 key committed here -- and byte-for-byte the
# same literal in this repository's other Spring project, because it is the
# value the course template ships with. A signing key that is public and
# shared is one anybody can mint valid tokens with, so it is read from
# JWT_SECRET instead. There is deliberately no default: the application should
# refuse to start rather than come up signing tokens with a key that is
# published in every copy of the template.
#
#   export JWT_SECRET="$(openssl rand -base64 48)"
#
jwt.base64-secret=${JWT_SECRET}

jwt.expiration=604800
jwt.token-validity-in-seconds=86400
jwt.token-validity-in-seconds-for-remember-me=108000
jwt.route.authentication.path=/login
jwt.route.authentication.refresh=/refresh

server.error.include-stacktrace=never
