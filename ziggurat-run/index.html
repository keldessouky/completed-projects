<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover so we can read env(safe-area-inset-*) and paint under the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14100E" />
  <title>Ziggurat Run</title>
  <style>
    :root {
      /* Safe-area insets surfaced as custom props so TS can read them via getComputedStyle. */
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #14100E; /* bitumen — letterbox color */
      overflow: hidden;
      /* iOS: kill rubber-band scroll, text selection, callouts, double-tap zoom */
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #app, #app canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }
    /* Pre-Pixi splash: replaced by the in-engine loading screen as soon as the module boots. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #EDE3D2;
      font-family: Georgia, 'Times New Roman', serif;
      letter-spacing: 0.35em;
      font-size: 15px;
      z-index: 5;
      background: #14100E;
      transition: opacity 0.25s ease-out;
      pointer-events: none;
    }
    #splash .zig {
      width: 44px; height: 34px;
      background:
        linear-gradient(#D9A441, #D9A441) 50% 0 / 12px 10px,
        linear-gradient(#C97B3C, #C97B3C) 50% 12px / 26px 10px,
        linear-gradient(#1B3B8F, #1B3B8F) 50% 24px / 40px 10px;
      background-repeat: no-repeat;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.45; } }
    /* WebGL context-loss recovery overlay — shown by TS, never white-screens. */
    #gl-lost {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #EDE3D2;
      background: rgba(20, 16, 14, 0.96);
      font-family: Georgia, serif;
      font-size: 17px;
      text-align: center;
      z-index: 10;
      padding: 24px;
    }
    #gl-lost small { opacity: 0.7; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="splash" aria-hidden="true"><div class="zig"></div><div>ZIGGURAT&nbsp;RUN</div></div>
  <div id="gl-lost"><div>The river swallowed the image.</div><small>Tap anywhere to restore.</small></div>
  <noscript><div style="color:#EDE3D2;font-family:serif;padding:40px;text-align:center">Ziggurat Run needs JavaScript.</div></noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
