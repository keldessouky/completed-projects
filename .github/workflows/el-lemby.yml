name: El-Lemby (macOS)

on:
  push:
    branches: ['**']
    paths:
      - 'el-lemby-platformer/**'
      - '.github/workflows/el-lemby.yml'
  pull_request:
    paths:
      - 'el-lemby-platformer/**'
      - '.github/workflows/el-lemby.yml'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build & test (SwiftPM)
    runs-on: macos-14
    defaults:
      run:
        working-directory: el-lemby-platformer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: Asset pipeline sanity
        run: |
          python3 tools/generate_assets.py
          python3 tools/generate_sfx.py
          python3 tools/build_level1.py
          python3 tools/render_level.py
