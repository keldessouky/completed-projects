name: Multiverse Duel

on:
  push:
    branches: ['**']
    paths:
      - 'multiverse-duel/**'
      - '.github/workflows/multiverse-duel.yml'
  pull_request:
    paths:
      - 'multiverse-duel/**'
      - '.github/workflows/multiverse-duel.yml'

defaults:
  run:
    shell: bash
    working-directory: multiverse-duel

jobs:
  build:
    name: ${{ matrix.label }} — typecheck, rules tests, AI games, browser bot, launcher
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: multiverse-duel/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Parser, mana, rules, deck builder and AI-vs-AI games
        run: npm test
      - name: Headless Chrome plays full games through the UI (incl. 4 players)
        run: npm run smoke
      - name: Multiverse Duel.command starts the game (macOS)
        if: runner.os == 'macOS'
        run: |
          ./"Multiverse Duel.command" --no-open &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:4321/__multiverse && break; sleep 0.5; done
          curl -fs http://127.0.0.1:4321/ | grep -q '<div id="root">'
          curl -fsI http://127.0.0.1:4321/data/cards.json.gz | grep -q '200 OK'
          kill %1
      - name: multiverse-duel.sh starts the game (Linux)
        if: runner.os == 'Linux'
        run: |
          ./multiverse-duel.sh --no-open &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:4321/__multiverse && break; sleep 0.5; done
          curl -fs http://127.0.0.1:4321/ | grep -q '<div id="root">'
          curl -fsI http://127.0.0.1:4321/data/cards.json.gz | grep -q '200 OK'
          kill %1
      - name: Multiverse Duel.cmd starts the game (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process cmd -ArgumentList '/c', '"Multiverse Duel.cmd" --no-open' -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            try { $ok = "$((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4321/__multiverse).Content)" -eq 'multiverse-duel' } catch {}
            if (-not $ok) { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { throw 'Multiverse Duel.cmd did not start the server' }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4321/).Content -notmatch '<div id="root">') { throw 'the game page is wrong' }
          if ((Invoke-WebRequest -UseBasicParsing -Method Head http://127.0.0.1:4321/data/cards.json.gz).StatusCode -ne 200) { throw 'card data missing' }
          Get-Process node | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiverse-duel-screenshots-${{ matrix.label }}
          path: multiverse-duel/test-results/
