name: Reactor Quest (iPhone, Android, web app)

on:
  push:
    branches: ['**']
    paths:
      - 'reactor-quest/**'
      - '.github/workflows/reactor-quest-phones.yml'
  pull_request:
    paths:
      - 'reactor-quest/**'
      - '.github/workflows/reactor-quest-phones.yml'

defaults:
  run:
    shell: bash
    working-directory: reactor-quest

jobs:
  iphone:
    name: iPhone — Safari's engine, then the native app in the iOS Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reactor-quest/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Play it as an iPhone in WebKit (the engine of Safari and every iPhone app)
        run: |
          npx playwright-core install webkit
          SMOKE_BROWSER=webkit npm run smoke:mobile
      - name: Make the Xcode project (icon, launch screen, status bar)
        id: xcode
        if: ${{ !cancelled() }}
        run: node tools/make-mobile.mjs ios --skip-build
      - name: Build the iPhone app for the Simulator
        if: ${{ !cancelled() && steps.xcode.outcome == 'success' }}
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const all = Object.entries(JSON.parse(require("fs").readFileSync(0)).devices)
              .filter(([runtime]) => runtime.includes("iOS"))
              .flatMap(([runtime, list]) => list.map((d) => ({ ...d, runtime })))
              .filter((d) => d.name.startsWith("iPhone"))
              .sort((a, b) => b.runtime.localeCompare(a.runtime, undefined, { numeric: true }));
            console.log((all.find((d) => /^iPhone \d+ Pro$/.test(d.name)) ?? all[0]).udid);')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Launch it on a simulated iPhone; TypeScript must start inside the app
        if: ${{ !cancelled() && steps.xcode.outcome == 'success' }}
        run: |
          mkdir -p test-results/iphone-app
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios-build/Build/Products/Debug-iphonesimulator/App.app
          # NSUnbufferedIO: the app's console lines (Swift print) reach the log at once, as in Xcode.
          SIMCTL_CHILD_NSUnbufferedIO=YES xcrun simctl launch --stdout="$PWD/test-results/iphone-app/app.log" --stderr="$PWD/test-results/iphone-app/app.log" "$UDID" io.github.keldessouky.reactorquest
          for i in $(seq 1 90); do grep -q "\[reactor\] compiler ready" test-results/iphone-app/app.log && break; sleep 1; done
          sleep 2
          xcrun simctl io "$UDID" screenshot test-results/iphone-app/title.png
          cat test-results/iphone-app/app.log | tail -20
          grep -q "\[reactor\] compiler ready" test-results/iphone-app/app.log
          ! grep -iE "Uncaught|ERROR MESSAGE" test-results/iphone-app/app.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reactor-quest-iphone-screenshots
          path: reactor-quest/test-results/

  android:
    name: Android — Chrome, then the APK on an emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reactor-quest/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Play it as an Android phone in Chrome
        run: SMOKE_DEVICE=android npm run smoke:mobile
      - name: Build the Android app (APK)
        id: apk
        if: ${{ !cancelled() }}
        run: node tools/make-mobile.mjs android --skip-build --apk
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        with:
          name: reactor-quest-android-apk
          path: reactor-quest/Reactor-Quest.apk
          if-no-files-found: error
      - name: Enable KVM for the emulator
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the APK on an emulated phone and play it
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: reactor-quest
          # The emulator's home screen sometimes stalls on a cold CI boot and throws an
          # "isn't responding" dialog over everything; the game doesn't need it. The
          # on-screen keyboard is switched off too: opening it drops the debugger's
          # connection to the WebView (the test types through that connection anyway).
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb shell ime disable com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME || true
            adb install -r Reactor-Quest.apk
            node tools/smoke-android-app.mjs; status=$?; adb logcat -d > test-results/android-app/logcat.txt; grep -iE "renderer|crash|FATAL|lowmemory|killing|Reactor|chromium" test-results/android-app/logcat.txt | grep -v "^$" | tail -60; exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reactor-quest-android-screenshots
          path: reactor-quest/test-results/

  pages:
    name: Publish the web app (and the APK) to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [iphone, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reactor-quest/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: reactor-quest-android-apk
          path: reactor-quest/dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reactor-quest/dist
      - id: deploy
        uses: actions/deploy-pages@v4
