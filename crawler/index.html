<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover so we can read env(safe-area-inset-*) and paint under the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14100E" />
  <title>Crawler — The Open Floor</title>
  <style>
    :root {
      /* Safe-area insets surfaced as custom props so TS can read them via getComputedStyle. */
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0D0E11; /* pit — letterbox color */
      overflow: hidden;
      /* iOS: kill rubber-band scroll, text selection, callouts, double-tap zoom */
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #app, #app canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }
    /* Pre-Pixi splash: replaced by the in-engine loading screen as soon as the module boots. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #E6E3DD;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: 0.35em;
      font-size: 15px;
      z-index: 5;
      background: #0D0E11;
      transition: opacity 0.25s ease-out;
      pointer-events: none;
    }
    /* three treads going down — the same mark the loading screen draws */
    #splash .mark {
      width: 46px; height: 36px;
      background:
        linear-gradient(#E6E3DD, #E6E3DD) 0 0 / 20px 7px,
        linear-gradient(#E6E3DD, #E6E3DD) 13px 12px / 20px 7px,
        linear-gradient(#E6E3DD, #E6E3DD) 26px 24px / 20px 7px;
      background-repeat: no-repeat;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.45; } }
    /* WebGL context-loss recovery overlay — shown by TS, never white-screens. */
    #gl-lost {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #E6E3DD;
      background: rgba(13, 14, 17, 0.96);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 17px;
      text-align: center;
      z-index: 10;
      padding: 24px;
    }
    #gl-lost small { opacity: 0.7; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="splash" aria-hidden="true"><div class="mark"></div><div>CRAWLER</div></div>
  <div id="gl-lost"><div>The feed cut out.</div><small>Tap anywhere to restore.</small></div>
  <noscript><div style="color:#EDE3D2;font-family:serif;padding:40px;text-align:center">Crawler needs JavaScript.</div></noscript>
  <!--
    Watchdog. Deliberately a CLASSIC inline script, because the failure it
    exists to report is precisely "the main script never ran" — and the most
    common cause of that is a module script blocked from a file:// origin,
    which would take a module watchdog down with it.

    Without this, a bundle that never executes looks exactly like a bundle
    that is still loading: the static splash sits there, pulsing, forever.
    That is what a player sees, and they have no way to tell you why.
  -->
  <script>
    (function () {
      var STALL_MS = 9000;
      setTimeout(function () {
        if (window.__cr) return;              // engine is up, nothing to say
        var el = document.getElementById('splash');
        if (!el) return;
        el.style.letterSpacing = '0';
        el.style.fontSize = '14px';
        el.style.lineHeight = '1.5';
        el.style.padding = '0 28px';
        el.style.textAlign = 'center';
        el.innerHTML =
          '<div style="font-size:17px;letter-spacing:.2em;margin-bottom:14px">CRAWLER</div>'
          + '<div style="color:#E0574A">The engine did not start.</div>'
          + '<div style="opacity:.75;margin-top:10px">The page loaded but its script never ran. '
          + 'On iOS this usually means the file was opened somewhere that blocks local scripts.</div>'
          + '<div style="opacity:.75;margin-top:10px">Try opening it in Safari rather than the Files preview, '
          + 'or serve it over http.</div>';
      }, STALL_MS);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
